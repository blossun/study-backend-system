config:
  target: "http://lsp-inference-jp.line-apps-rc.com"
  phases:
    - duration: 60 # 1분 동안 초당 40명의 사용자
      arrivalRate: 40
      name: Ramp up to 40
    - duration: 60 # 1분 동안 초당 80명의 사용자
      arrivalRate: 80
      name: Ramp up to 80
    - duration: 60 # 1분 동안 초당 120명의 사용자
      arrivalRate: 120
      name: Ramp up to 120
    - duration: 60 # 1분 동안 초당 160명의 사용자
      arrivalRate: 160
      name: Ramp up to 160
    - duration: 60 # 1분 동안 초당 200명의 사용자
      arrivalRate: 200
      name: Ramp up to 200
    - duration: 300 # 5분 동안 초당 200명의 사용자 유지
      arrivalRate: 200
      name: Sustain 200
  payload:
    path: "./product_ids_real_part1.csv"
    fields:
      - "productId"
scenarios:
  - name: "product auto-category mapping service"
    flow:
      - put:
          url: "/api/v1/categoryMappings/products/{{ productId }}"
          auth:
            user: lsp-jp
            pass: cd5ee207-655e-4fb4-b7b8-8251f31927c3

